<style>
  :root{--ink:#162740;--muted:#637184;--accent:#176b65;--accent2:#e6f3ef;--line:#dbe4e9;--bg:#f2f6f8;--paper:#fff;--red:#ac3b35;--green:#177153;--gold:#a46c1f}

  .pages{display:grid;grid-template-columns:repeat(5,1fr);gap:8px}.pagebtn{min-height:40px;border:1px solid var(--line);background:#fff;border-radius:9px;font-weight:750;color:var(--ink)}.pagebtn.active{outline:2px solid var(--accent);outline-offset:1px}.pagebtn.done{background:#e5f4ee;color:#126445}.pagebtn.partial{background:#fff3da;color:#835310}

<script id="quiz-data" type="application/json">[{"title": "Vocabulary, grammar and symbols", "questions": [{"number": 1, "stem": "A sequence formed by adding the same fixed number to each preceding term is called ____.", "type": "choice", "options": ["a harmonic sequence", "an arithmetic sequence", "a geometric sequence", "an alternating sequence"], "answer": "B", "explanation": "Arithmetic sequence là cấp số cộng: mỗi số hạng sau được tạo bằng cách cộng cùng một công sai vào số hạng trước."}, {"number": 2, "stem": "What term describes a real sequence that approaches a finite number as the term index increases without bound?", "type": "choice", "options": ["periodic", "unbounded", "convergent", "divergent"], "answer": "C", "explanation": "Convergent nghĩa là hội tụ; số hạng tiến đến một giới hạn hữu hạn khi chỉ số tăng vô hạn."}, {"number": 3, "stem": "Which term is another name for the slope of a tangent to a curve?", "type": "choice", "options": ["gradient", "curvature", "intercept", "concavity"], "answer": "A", "explanation": "Gradient chỉ hệ số góc của tiếp tuyến; concavity chỉ tính lõm, còn intercept chỉ giao điểm hoặc tọa độ giao với trục."}, {"number": 4, "stem": "At a point where the function value is at least as large as all nearby function values, the function has ____.", "type": "choice", "options": ["an inflection point", "a local minimum", "a discontinuity", "a local maximum"], "answer": "D", "explanation": "Local maximum là cực đại địa phương: giá trị tại điểm xét không nhỏ hơn các giá trị ở lân cận."}, {"number": 5, "stem": "In an expression ∫ f(x) dx, what is f(x) called?", "type": "choice", "options": ["upper limit", "antiderivative", "integrand", "constant of integration"], "answer": "C", "explanation": "Integrand là hàm dưới dấu tích phân; khác với antiderivative (nguyên hàm)."}]}, {"title": "Vocabulary, grammar and symbols", "questions": [{"number": 6, "stem": "If knowing that B occurred does not change the probability of A, with P(B) > 0, how are A and B described?", "type": "choice", "options": ["independent", "mutually exclusive", "complementary", "identical"], "answer": "A", "explanation": "Independent là độc lập: với P(B) > 0, P(A | B) = P(A). Không đồng nghĩa với xung khắc."}, {"number": 7, "stem": "The event consisting of all outcomes outside event A is called ____.", "type": "choice", "options": ["an intersection with A", "a subset of A", "the union of A with itself", "the complement of A"], "answer": "D", "explanation": "Complement of A là biến cố đối, gồm các kết quả trong không gian mẫu nhưng không thuộc A."}, {"number": 8, "stem": "For a discrete random variable, what is the probability-weighted average of its possible values called?", "type": "choice", "options": ["mode", "expectation", "sample space", "relative frequency"], "answer": "B", "explanation": "Expectation là kỳ vọng: tổng các tích giữa giá trị của biến và xác suất tương ứng. Kỳ vọng không nhất thiết là giá trị có xác suất lớn nhất."}, {"number": 9, "stem": "What is a data value occurring more frequently than every other value in a data set called?", "type": "choice", "options": ["median", "range", "mode", "mean"], "answer": "C", "explanation": "Mode là mốt: giá trị có tần số lớn nhất. Định nghĩa trong câu này mô tả trường hợp có một mốt duy nhất."}, {"number": 10, "stem": "In a statistical study, what is the entire group about which conclusions are intended called?", "type": "choice", "options": ["population", "sample", "observation", "statistic"], "answer": "A", "explanation": "Population là tổng thể nghiên cứu; sample là mẫu được lấy từ tổng thể."}]}, {"title": "Vocabulary, grammar and symbols", "questions": [{"number": 11, "stem": "Which reading correctly describes the sequence rule uₙ = 5 − 2n?", "type": "choice", "options": ["The nth term is twice n minus five.", "The nth term is five times two minus n.", "The nth term is five minus n squared.", "The nth term is five minus twice n."], "answer": "D", "explanation": "2n đọc là twice n; 5 − 2n là five minus twice n. Chỉ số n chỉ vị trí của số hạng."}, {"number": 12, "stem": "How is f′(−2) = 4 read?", "type": "choice", "options": ["The value of f at negative two is four.", "The first derivative of f at negative two is four.", "The first derivative of f at four is negative two.", "The second derivative of f at negative two is four."], "answer": "B", "explanation": "Một dấu phẩy chỉ đạo hàm cấp một; (−2) là điểm đánh giá đạo hàm, còn 4 là giá trị đạo hàm."}, {"number": 13, "stem": "How is ∫₀² x² dx read?", "type": "choice", "options": ["The derivative from zero to two of x squared with respect to x.", "The integral from two to zero of x squared with respect to x.", "The integral from zero to two of x squared with respect to x.", "The integral from zero to two of two x with respect to x."], "answer": "C", "explanation": "Cận 0 đến 2; x² đọc là x squared; dx cho biết lấy tích phân theo x."}, {"number": 14, "stem": "Which reading correctly describes P(A ∪ B)?", "type": "choice", "options": ["The probability that A or B occurs, or both.", "The probability that both A and B occur.", "The probability that A occurs but B does not.", "The probability that neither A nor B occurs."], "answer": "A", "explanation": "∪ biểu thị hợp. Or trong xác suất thường là hoặc theo nghĩa bao hàm: có thể cả hai cùng xảy ra."}, {"number": 15, "stem": "In standard population notation, how is σ read?", "type": "choice", "options": ["sigma squared, the population variance", "sigma, the population mean", "sigma squared, the sample mean", "sigma, the population standard deviation"], "answer": "D", "explanation": "σ đọc là sigma, kí hiệu độ lệch chuẩn tổng thể; σ² là phương sai tổng thể."}]}, {"title": "Vocabulary, grammar and symbols", "questions": [{"number": 16, "stem": "Complete the sentence: “As n increases, the terms tend ____ a fixed limit.”", "type": "choice", "options": ["at", "to", "of", "by"], "answer": "B", "explanation": "Tend to a limit nghĩa là tiến đến một giới hạn."}, {"number": 17, "stem": "Complete the sentence: “We integrate the rate function ____ an interval.”", "type": "choice", "options": ["by", "with", "over", "from"], "answer": "C", "explanation": "Integrate over an interval: lấy tích phân trên một khoảng."}, {"number": 18, "stem": "Complete the sentence: “The result of the second trial is independent ____ the first result.”", "type": "choice", "options": ["of", "to", "for", "by"], "answer": "A", "explanation": "Cụm đúng là independent of: độc lập với."}, {"number": 19, "stem": "Complete the sentence: “For a fair die, the six outcomes are ____ likely.”", "type": "choice", "options": ["equal", "equality", "equalize", "equally"], "answer": "D", "explanation": "Equally là trạng từ bổ nghĩa cho likely: equally likely nghĩa là đồng khả năng."}, {"number": 20, "stem": "Complete the sentence: “The ____ of the observations is displayed in a frequency table.”", "type": "choice", "options": ["distribute", "distribution", "distributed", "distributing"], "answer": "B", "explanation": "Distribution là danh từ, phù hợp sau the và trước of the observations."}]}, {"title": "Guided cloze test", "questions": [{"number": 21, "stem": "Blank 21", "type": "choice", "options": ["arithmetic", "harmonic", "constant", "geometric"], "answer": "D", "explanation": "Lặp phép nhân với một thừa số cố định tạo geometric sequence (cấp số nhân), thay vì cấp số cộng tạo bằng phép cộng."}, {"number": 22, "stem": "Blank 22", "type": "choice", "options": ["average", "instantaneous", "cumulative", "constant"], "answer": "B", "explanation": "Đạo hàm biểu thị instantaneous rate of change: tốc độ biến đổi tức thời."}, {"number": 23, "stem": "Blank 23", "type": "choice", "options": ["differentiation", "curvature", "accumulation", "oscillation"], "answer": "C", "explanation": "Lấy tích phân một hàm tốc độ trên khoảng cho đại lượng tích lũy (accumulation), có xét dấu."}, {"number": 24, "stem": "Blank 24", "type": "choice", "options": ["area", "height", "slope", "perimeter"], "answer": "A", "explanation": "Xác suất trên khoảng bằng diện tích dưới đường mật độ trong khoảng đó; không phải chiều cao của mật độ tại một điểm."}, {"number": 25, "stem": "Blank 25", "type": "choice", "options": ["differentiated", "integrated", "subtracted", "given"], "answer": "D", "explanation": "Given là thông tin được cho, dùng làm điều kiện trong bài toán xác suất."}], "passage": "Mathematical models describe patterns and change. If each new term is obtained by multiplying the preceding term by a fixed nonzero number, the sequence is (21) ____. A derivative describes an (22) ____ rate of change. Integrating a rate measures (23) ____ over an interval.\n\nCalculus also supports probability. For a continuous density, the probability of an interval equals the (24) ____ beneath the density curve over that interval. Conditioning on an event restricts attention to outcomes within that event, so the calculation must use the information that is (25) ____ in the problem."}, {"title": "Mathematical language and problems", "questions": [{"number": 26, "stem": "An arithmetic sequence begins with −4 and increases by 6 from one term to the next. What is its seventh term?", "type": "choice", "options": ["38", "32", "42", "−28"], "answer": "B", "explanation": "Từ số hạng đầu đến số hạng thứ bảy có 6 bước: −4 + 6 × 6 = 32."}, {"number": 27, "stem": "A geometric sequence has first term 3 and common ratio 2. What is the sum of its first four terms?", "type": "choice", "options": ["24", "42", "45", "48"], "answer": "C", "explanation": "First four terms là 3, 6, 12, 24; sum yêu cầu cộng cả bốn: 45, không chỉ trả số hạng thứ tư 24."}, {"number": 28, "stem": "As x approaches 1 from either side, f(x) approaches 9, although f(1) = 2. What is the limit of f(x) as x approaches 1?", "type": "choice", "options": ["2", "7", "It does not exist.", "9"], "answer": "D", "explanation": "Hai giới hạn một bên cùng bằng 9 nên giới hạn bằng 9. Giá trị f(1) = 2 không làm thay đổi giới hạn này."}, {"number": 29, "stem": "A curve has equation y = x² + 2x. What is the gradient of its tangent at x = 3?", "type": "choice", "options": ["8", "15", "6", "2"], "answer": "A", "explanation": "Gradient of its tangent bằng y′(3). Vì y′ = 2x + 2, hệ số góc bằng 8; y(3) = 15 là tung độ."}, {"number": 30, "stem": "At an interior point of an interval, the derivative of a differentiable function changes from negative on the left to positive on the right. What does the function have at that point?", "type": "choice", "options": ["a local maximum", "a local minimum", "necessarily an inflection point", "necessarily an x-intercept"], "answer": "B", "explanation": "Đạo hàm đổi từ âm sang dương cho hàm chuyển từ giảm sang tăng, nên có cực tiểu địa phương."}]}, {"title": "Mathematical language and problems", "questions": [{"number": 31, "stem": "A function has constant value −4 from x = 1 to x = 3. What is its definite integral over that interval?", "type": "choice", "options": ["8", "−4", "−8", "−12"], "answer": "C", "explanation": "Tích phân có dấu bằng −4 × (3 − 1) = −8; diện tích hình học tương ứng là 8."}, {"number": 32, "stem": "A region lies between y = x + 3 and the x-axis from x = 0 to x = 2. What is its area, in square units?", "type": "choice", "options": ["4", "6", "10", "8"], "answer": "D", "explanation": "Hàm dương trên [0, 2]. Diện tích hình thang có hai chiều cao 3 và 5, rộng 2: (3 + 5) × 2/2 = 8."}, {"number": 33, "stem": "A fair die with faces numbered 1 to 6 is rolled once. What is the probability of a number at most 3?", "type": "choice", "options": ["0.5", "1/3", "1/6", "2/3"], "answer": "A", "explanation": "At most 3 bao gồm 3: các kết quả 1, 2, 3 cho xác suất 3/6 = 0.5."}, {"number": 34, "stem": "A bag contains five white balls and three black balls. Two balls are drawn uniformly at random without replacement. What is the probability that both are black?", "type": "choice", "options": ["9/64", "3/8", "3/28", "1/28"], "answer": "C", "explanation": "Without replacement: xác suất đen lần đầu 3/8, rồi còn 2 đen trong 7 quả. Tích (3/8)(2/7) = 3/28."}, {"number": 35, "stem": "Of 48 students, 24 are swimmers and 16 are both swimmers and cyclists. A student is selected uniformly at random. Given that the student is a swimmer, what is the probability that the student is a cyclist?", "type": "choice", "options": ["1/3", "2/3", "1/2", "3/4"], "answer": "B", "explanation": "Given that swimmer thu hẹp nhóm xét còn 24 người; 16 người trong nhóm đó đạp xe. Xác suất bằng 16/24 = 2/3."}]}, {"title": "Mathematical language and problems", "questions": [{"number": 36, "stem": "The number of defective items in five independent inspections has a binomial distribution with defect probability 0.2 in each inspection. What is the expected number of defective items?", "type": "choice", "options": ["0.2", "0.8", "5", "1"], "answer": "D", "explanation": "Kỳ vọng nhị thức np = 5 × 0.2 = 1. Phương sai là 0.8, không phải đại lượng được hỏi."}, {"number": 37, "stem": "A waiting time is uniformly distributed from 2 to 14 minutes. What is the probability of waiting more than 8 minutes?", "type": "choice", "options": ["0.5", "1/3", "2/3", "0.75"], "answer": "A", "explanation": "Khoảng hơn 8 đến 14 dài 6, toàn khoảng 2 đến 14 dài 12, nên xác suất 6/12 = 0.5."}, {"number": 38, "stem": "A normal variable has mean 100 and variance 25. What is the standardized z-score of a value of 90?", "type": "choice", "options": ["−0.4", "−2", "2", "−5"], "answer": "B", "explanation": "Độ lệch chuẩn là √25 = 5. Điểm z = (90 − 100)/5 = −2; không chia cho phương sai."}, {"number": 39, "stem": "Five recorded values are 12, 3, 9, 5 and 7. What is their median?", "type": "choice", "options": ["5", "9", "7", "7.2"], "answer": "C", "explanation": "Sắp xếp thành 3, 5, 7, 9, 12; giá trị ở giữa là 7. Trung bình 7.2 là đại lượng khác."}, {"number": 40, "stem": "Five students have a mean score of 8, and three other students have a mean score of 16. What is the mean score of all eight students?", "type": "choice", "options": ["12", "10", "24", "11"], "answer": "D", "explanation": "Tổng điểm là 5 × 8 + 3 × 16 = 88, nên trung bình 88/8 = 11. Không lấy trung bình đơn giản của hai trung bình nhóm vì số người khác nhau."}]}, {"title": "Short answers", "questions": [{"number": 41, "stem": "A display has six rows. The first row contains eight items, and each successive row contains four more items than the preceding row. How many items are there in all six rows together?", "type": "number", "answer": "108", "explanation": "Các số lượng là 8, 12, 16, 20, 24, 28. Tổng = 6 × (8 + 28)/2 = 108; không chỉ trả số lượng hàng cuối."}, {"number": 42, "stem": "A geometric sequence has a positive common ratio. Its third term is 18 and its fifth term is 2. What is its first term?", "type": "number", "answer": "162", "explanation": "Từ số hạng thứ ba đến thứ năm có hai lần nhân công bội: r² = 2/18 = 1/9. Vì r > 0, r = 1/3. Số hạng đầu = 18/r² = 162."}, {"number": 43, "stem": "An object has velocity v(t) = 3t² − 2t metres per second at time t seconds. What is its instantaneous acceleration at t = 4, in metres per second squared?", "type": "number", "answer": "22", "explanation": "Gia tốc là đạo hàm của vận tốc: v′(t) = 6t − 2. Tại t = 4, gia tốc bằng 24 − 2 = 22 m/s²."}, {"number": 44, "stem": "The function f(x) = −2x² + 12x − 7 is defined for all real x. What is its maximum value?", "type": "number", "answer": "11", "explanation": "Viết f(x) = 11 − 2(x − 3)², nên giá trị lớn nhất là 11, đạt khi x = 3. Câu hỏi yêu cầu giá trị hàm, không phải hoành độ đỉnh."}, {"number": 45, "stem": "The graph y = x − 3 crosses the x-axis at x = 3. What is the total area between the graph and the x-axis from x = 0 to x = 5, in square units?", "type": "number", "answer": "6.5", "explanation": "Total area cộng diện tích hai phần: tam giác dưới trục có đáy 3, cao 3, diện tích 4.5; tam giác trên trục có đáy 2, cao 2, diện tích 2. Tổng = 6.5, không dùng tích phân có dấu −2.5."}]}, {"title": "Short answers", "questions": [{"number": 46, "stem": "A spinner has four possible results. It is spun once, followed by three independent tosses of a fair coin, independent of the spin. The outcome records the spinner result and all coin results in order. How many possible outcomes are there?", "type": "number", "answer": "32", "explanation": "Có 4 kết quả vòng quay và 2³ kết quả có thứ tự của ba lần tung đồng xu. Tổng số kết quả = 4 × 8 = 32."}, {"number": 47, "stem": "A discrete random variable takes values 0, 2 and 5 with respective probabilities 0.2, 0.5 and 0.3. What is its expected value?", "type": "number", "answer": "2.5", "explanation": "Respective ghép từng giá trị với xác suất theo đúng thứ tự. Kỳ vọng = 0 × 0.2 + 2 × 0.5 + 5 × 0.3 = 2.5; không lấy trung bình không trọng số."}, {"number": 48, "stem": "Two machines operate independently. Their probabilities of working throughout a day are 0.9 and 0.7. What is the probability that at least one machine fails during the day?", "type": "number", "answer": "0.37", "explanation": "Biến cố đối của at least one fails là cả hai đều hoạt động cả ngày. Xác suất cả hai hoạt động = 0.9 × 0.7 = 0.63; xác suất cần tìm = 1 − 0.63 = 0.37.", "probabilityDecimal": true}, {"number": 49, "stem": "In a survey of 80 people, 30 read newspaper A, 24 read newspaper B, and 8 read both. A person is selected uniformly at random. What is the probability that the person reads neither newspaper?", "type": "number", "answer": "0.425", "explanation": "Số người đọc ít nhất một báo = 30 + 24 − 8 = 46. Neither nghĩa là không đọc cả A lẫn B: có 80 − 46 = 34 người, xác suất 34/80 = 0.425.", "probabilityDecimal": true}, {"number": 50, "stem": "The entire population consists of the three values 2, 5 and 8. What is the population variance? Divide by the population size N.", "type": "number", "answer": "6", "explanation": "Trung bình tổng thể là 5. Tổng bình phương độ lệch = 9 + 0 + 9 = 18. Phương sai tổng thể = 18/3 = 6, khác phương sai mẫu dùng n − 1."}]}]</script>
<script>
(() => {
  'use strict';
  const groups=JSON.parse(document.getElementById('quiz-data').textContent), all=groups.flatMap(g=>g.questions);
  const KEY='combined-ch45-review-20261007-v1', DURATION=60*60*1000;
  const main=document.getElementById('main'),side=document.getElementById('side'),clock=document.getElementById('clock');
  let state=read(),tick=null;
  function fresh(){return {status:'intro',page:0,answers:{},startedAt:null,submittedAt:null}}
  function read(){try{const v=JSON.parse(localStorage.getItem(KEY));return v&&['intro','working','submitted'].includes(v.status)?v:fresh()}catch{return fresh()}}
  function save(){try{localStorage.setItem(KEY,JSON.stringify(state))}catch{}}
  function esc(s){return String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
  function numFilled(v){return v!==undefined&&String(v).trim()!==''}
  function answered(q){return numFilled(state.answers[q.number])}
  function count(){return all.filter(answered).length}
  function timeLeft(){return Math.max(0,DURATION-(Date.now()-state.startedAt))}
  function clockUpdate(){if(state.status!=='working')return;const left=timeLeft();clock.textContent=`${String(Math.floor(left/60000)).padStart(2,'0')}:${String(Math.floor(left%60000/1000)).padStart(2,'0')}`;clock.classList.toggle('alert',left<300000);if(left===0)submit(true)}
  function go(page){state.page=Math.max(0,Math.min(groups.length-1,page));save();render();window.scrollTo({top:0,behavior:'instant'})}
  function intro(){side.classList.add('hidden');clock.classList.add('hidden');main.innerHTML=`<div class="eyebrow">Practice test</div><h1>Combined review · Chapters 4 and 5</h1><p class="lead">A 50-question review of analysis, probability and statistics through mathematical English: vocabulary, symbols, a five-blank passage, word problems and short answers.</p><div class="meta"><span class="chip">50 questions</span><span class="chip">10 pages · 5 questions each</span><span class="chip">60 minutes</span><span class="chip">10 points</span></div><p>Questions 1–40: choose A–D. Questions 41–50: enter a numerical answer. For probabilities in Questions 48–49, enter a decimal between 0 and 1, using a decimal point. Do not enter fractions, percentages or units. No rounding is needed. Each correct answer earns 0.2 point.</p><p class="muted">Scope: Chapter 4 Analysis, Units 1–3; Chapter 5 Probability and Statistics, Units 1–4. A basic calculator may be used.</p><p class="notice">Your work is saved on this browser while you practise. The answer key and explanations appear after submission.</p><button class="btn" id="start">Start the test</button>`;document.getElementById('start').onclick=()=>{state={...fresh(),status:'working',startedAt:Date.now()};save();render()}}
  function sidePanel(){side.classList.remove('hidden');side.classList.add('collapsed');const n=count();side.innerHTML=`<button id="toggleNav" class="btn secondary mobileNav" type="button">Pages and progress ▾</button><div class="sideBody"><h3>Question navigator</h3><div class="sideStat">${n} / 50 answered</div><div class="pages">${groups.map((g,i)=>{const done=g.questions.filter(answered).length;return `<button type="button" class="pagebtn ${i===state.page?'active':''} ${done===5?'done':done?'partial':''}" data-page="${i}" aria-label="Page ${i+1}, ${done} of 5 answered">${i+1}</button>`}).join('')}</div><p class="legend">Green: all answered · Yellow: partially answered</p></div>`;side.querySelector('#toggleNav').onclick=()=>side.classList.toggle('collapsed');side.querySelectorAll('[data-page]').forEach(b=>b.onclick=()=>go(+b.dataset.page))}
  function working(){clock.classList.remove('hidden');clockUpdate();sidePanel();const group=groups[state.page],first=group.questions[0].number;
    main.innerHTML=`<div class="eyebrow">Page ${state.page+1} of 10 · Questions ${first}–${first+4}</div><h2>${esc(group.title)}</h2><p class="muted">Answer each question, then move to another page. You can return before submitting.</p><div class="bar"><span style="width:${count()*2}%"></span></div>${group.passage?`<div class="passage"><strong>Read the passage and complete blanks 21–25.</strong><br>${esc(group.passage)}</div>`:''}${group.questions.map(q=>`<article class="question"><div class="qhead"><div class="qnum">${q.number}</div><div class="stem">${esc(q.stem)}</div></div>${q.type==='choice'?`<div class="options">${q.options.map((o,i)=>`<label class="option"><input type="radio" name="q${q.number}" value="${'ABCD'[i]}" ${state.answers[q.number]==='ABCD'[i]?'checked':''}><span class="letter">${'ABCD'[i]}.</span><span>${esc(o)}</span></label>`).join('')}</div>`:`<input class="numeric" type="text" inputmode="decimal" autocomplete="off" spellcheck="false" data-number="${q.number}" value="${esc(state.answers[q.number]??'')}" placeholder="Enter your answer" aria-label="Answer for question ${q.number}"><small class="hint">${q.probabilityDecimal?'Enter a decimal between 0 and 1, for example 0.25. No fractions or percentages.':'Enter the numerical value only. Use a decimal point if needed; no rounding is required.'}</small>`}</article>`).join('')}<div class="actions"><button class="btn ghost" id="prev" ${state.page===0?'disabled':''}>← Previous page</button><div class="right"><button class="btn secondary" id="next" ${state.page===9?'disabled':''}>Next page →</button><button class="btn" id="submit">Submit test</button></div></div>`;
    main.querySelectorAll('input[type=radio]').forEach(el=>el.addEventListener('change',e=>{state.answers[+e.target.name.slice(1)]=e.target.value;save();sidePanel();main.querySelector('.bar span').style.width=count()*2+'%'}));
    main.querySelectorAll('[data-number]').forEach(el=>el.addEventListener('input',e=>{state.answers[+e.target.dataset.number]=e.target.value;save();sidePanel();main.querySelector('.bar span').style.width=count()*2+'%'}));
    main.querySelector('#prev').onclick=()=>go(state.page-1);main.querySelector('#next').onclick=()=>go(state.page+1);main.querySelector('#submit').onclick=()=>submit(false);
  }
  function parseNumber(v){let s=String(v??'').trim().replace(/[−–]/g,'-').replace(/\s+/g,'');if(!s)return null;
    if(!/^[+-]?(?:\d+(?:\.\d*)?|\.\d+)$/.test(s))return null;return {value:Number(s),fraction:false}}
  function correct(q){const response=state.answers[q.number];if(!numFilled(response))return false;if(q.type==='choice')return response===q.answer;
    const normalized=String(response).replace(/[−–]/g,'-').replace(/\s+/g,'');
    if(q.probabilityDecimal&&!/^[+]?(?:\d+\.\d+|\.\d+)$/.test(normalized))return false;
    const got=parseNumber(response),expected=parseNumber(q.answer);if(!got||!expected)return false;
    if(q.probabilityDecimal&&(got.value<0||got.value>1))return false;
    return Math.abs(got.value-expected.value)<1e-10}
  function submit(auto){if(state.status!=='working')return;
    const blank=50-count();if(!auto&&blank&&!confirm(`You have ${blank} unanswered question${blank===1?'':'s'}. Submit the test now?`))return;
    if(!auto&&!blank&&!confirm('Submit your answers and view the results?'))return;
    state.status='submitted';state.submittedAt=Date.now();save();render();window.scrollTo({top:0,behavior:'instant'})}
  function results(){clock.classList.add('hidden');side.classList.add('hidden');const right=all.filter(correct).length,blank=50-count();main.innerHTML=`<div class="eyebrow">Practice result</div><h1>Combined review · Chapters 4 and 5</h1><div class="resultTop"><div class="score"><strong>${(right*.2).toFixed(1)}</strong><span>/ 10 points</span></div><div><h2>${right} correct · ${50-right-blank} incorrect · ${blank} blank</h2><p class="muted">Review your answers and the explanations below. Each question is worth 0.2 point.</p><button class="btn secondary" id="restart">Try again</button></div></div><h2>Answer review</h2><div class="resultNav">${groups.map((g,i)=>`<a href="#review-${i*5+1}">${i*5+1}–${i*5+5}</a>`).join('')}</div>${groups.map(g=>`${g.passage?`<div class="passage"><strong>Questions 21–25: shared passage</strong><br>${esc(g.passage)}</div>`:''}${g.questions.map(q=>{const raw=state.answers[q.number],filled=answered(q),ok=correct(q),response=q.type==='choice'&&filled?`${esc(raw)}. ${esc(q.options['ABCD'.indexOf(raw)]??'')}`:esc(filled?raw:'No answer');const key=q.type==='choice'?`${q.answer}. ${esc(q.options['ABCD'.indexOf(q.answer)])}`:esc(q.answer);return `<article class="review ${!filled?'blank':ok?'ok':'bad'}" id="review-${q.number}"><div class="label">Question ${q.number} · ${!filled?'Blank':ok?'Correct':'Incorrect'}</div><p><b>${esc(q.stem)}</b></p><p>Your answer: ${response}</p><p>Correct answer: <strong>${key}</strong></p><p class="explain">${esc(q.explanation)}</p></article>`}).join('')}`).join('')}<div class="actions"><button class="btn secondary" id="restartBottom">Try again</button><a class="btn ghost" href="#main">Back to top ↑</a></div>`;
    const restart=()=>{if(!confirm('Start a new attempt? Your current answers will be cleared on this browser.'))return;state=fresh();save();render();window.scrollTo({top:0,behavior:'instant'})};main.querySelector('#restart').onclick=restart;main.querySelector('#restartBottom').onclick=restart;
  }
  function render(){if(state.status==='working'&&timeLeft()===0){submit(true);return}if(state.status==='intro')intro();else if(state.status==='working')working();else results()}
  render();tick=setInterval(clockUpdate,1000);
})();
</script>
</body>
</html>
